---
# yamllint disable rule:truthy
name: Python Test

# Pushes to a PR branch are covered by the pull_request event; running
# the push event too doubled every job for in-repo branches.
on:
  push:
    branches: ["main", "v*-branch"]
  pull_request:

permissions:
  contents: read

# Cancel ongoing builds on new changes
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Build the abi3 wheel ONCE per OS. The wheel is `cp310-abi3`, so a single
  # build covers every supported Python version — the test matrix below
  # installs this prebuilt wheel instead of recompiling the Rust workspace
  # once per (os, python) combination.
  # ---------------------------------------------------------------------------
  build-wheel:
    name: Build wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # Pin the cargo target dir to a stable, absolute path. `uv build`
      # compiles in an isolated/throwaway directory, so without this the
      # build cache below would have nothing persistent to save. The
      # custom backend honors CARGO_TARGET_DIR when locating the staged
      # `west` binary.
      CARGO_TARGET_DIR: ${{ github.workspace }}/cargo-target
      CARGO_INCREMENTAL: "0"
      # This wheel is only used to run the test suite, so it doesn't need
      # optimized codegen. Compile the "release" profile at opt-level 0
      # (~2-3x faster). package.yml / release.yml build the real optimized
      # wheel for distribution.
      CARGO_PROFILE_RELEASE_OPT_LEVEL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "false"
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "256"
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        # A path with a space catches many quoting issues.
        with:
          path: "./check out"
          persist-credentials: false

      # Runners ship a stable Rust toolchain; we only add build caching.
      # TODO: pin to a commit SHA to match the repo's action-pinning policy
      # (see scorecards.yml / dependency-review.yml).
      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./check out"

      - name: Install uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          # abi3 floor; the resulting wheel works on 3.10+.
          python-version: '3.10'
          working-directory: './check out/'
          enable-cache: true

      - name: Build abi3 wheel
        working-directory: "./check out"
        run: uv build --wheel --out-dir dist

      - name: Upload wheel
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: wheel-${{ matrix.os }}
          path: "./check out/dist/*.whl"
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Test matrix: install the prebuilt wheel (no Rust toolchain, no compile)
  # and run the pytest / mypy / xdist poe tasks against it.
  # ---------------------------------------------------------------------------
  test:
    name: ${{ matrix.task }} (${{ matrix.os }} / ${{ matrix.python-version }})
    needs: [build-wheel]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
        task: [gh-test]
        # Extra one-off task combinations (see the GitHub docs on adding
        # matrix configurations). These need the compiled `_west_native`
        # module, so they install the prebuilt wheel like the test jobs.
        # Pure-Python checks (ruff) live in the separate `lint` job, which
        # skips the build entirely.
        include:
          # mypy needs the compiled extension module.
          - os: ubuntu-latest
            python-version: '3.13'
            task: types
          # Keep pytest-xdist exercised so it doesn't rot for developers.
          # Not `test-xdist`: that refs the `test` task, whose `build`
          # dep runs cargo, which can't fetch crates behind the blocked
          # network and would override the installed wheel anyway.
          - os: ubuntu-latest
            python-version: '3.13'
            task: gh-test-xdist

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: "./check out"
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          python-version: ${{ matrix.python-version }}
          working-directory: './check out/'
          enable-cache: true

      # Install dependency groups only — NOT the project. This avoids any
      # cargo compile; the project itself comes from the prebuilt wheel.
      - name: Install dependencies
        working-directory: "./check out"
        run: uv sync --frozen --no-install-project

      - name: Download prebuilt wheel
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wheel-${{ matrix.os }}
          path: wheel

      - name: Install prebuilt wheel
        working-directory: "./check out"
        shell: bash
        run: uv pip install --no-deps ../wheel/*.whl

      - name: Display Python version
        working-directory: "./check out"
        run: uv run --no-sync python -c "import sys; print(sys.version); print(sys.platform)"

      - name: Run ${{ matrix.task }} on ${{ matrix.os }} - ${{ matrix.python-version }}
        working-directory: "./check out"
        run: uv run --no-sync --env-file=.github/http_env_block.conf poe ${{ matrix.task }}

      - name: Upload coverage reports
        if: ${{ matrix.task == 'gh-test' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-${{ matrix.os }}-${{ matrix.python-version }}
          path: "./check out/.coverage"
          include-hidden-files: true

      - name: Upload test reports
        if: ${{ matrix.task == 'gh-test' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: tests-${{ matrix.os }}-${{ matrix.python-version }}
          path: "./check out/junit.xml"

  # ---------------------------------------------------------------------------
  # Lint + format: pure-Python static checks (ruff). No build needed, so this
  # never touches cargo — `--no-install-project` installs the tool deps only.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: "./check out"
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@803947b9bd8e9f986429fa0c5a41c367cd732b41 # v7.2.1
        with:
          python-version: '3.13'
          working-directory: './check out/'
          enable-cache: true

      - name: Install tools (no project build)
        working-directory: "./check out"
        run: uv sync --frozen --no-install-project

      - name: Lint
        working-directory: "./check out"
        run: uv run --no-sync poe gh-lint

      - name: Format check
        working-directory: "./check out"
        run: uv run --no-sync poe gh-format

  test-report:
    name: Report test results
    runs-on: ubuntu-latest
    needs: ["test"]
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0

      - name: Install coverage
        run: pip3 install coverage

      - name: Create coverage report
        run: |
          coverage combine coverage-*/.coverage
          coverage xml

      - name: Upload combined coverage report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: coverage-combined
          path: coverage.xml

      - name: Upload coverage to Codecov
        if: github.repository_owner == 'zephyrproject-rtos'
        uses: codecov/codecov-action@671740ac38dd9b0130fbe1cec585b89eea48d3de # v5.5.2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload test results to Codecov
        if: github.repository_owner == 'zephyrproject-rtos' && ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1.2.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
